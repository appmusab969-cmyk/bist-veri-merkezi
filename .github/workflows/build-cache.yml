name: Build data cache

# Günde 1 kez (07:30 UTC ≈ 10:30 TR, BIST açılışından sonra) + elle tetikleme.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

# İş akışının repoya commit atabilmesi için.
permissions:
  contents: write

concurrency:
  group: build-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build cache JSON
        working-directory: scripts
        run: node build-cache.mjs

      - name: Commit updated cache
        run: |
          git config user.name  "pusula-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore(data): günlük önbellek yenilendi [skip ci]"
            git push
          fi
